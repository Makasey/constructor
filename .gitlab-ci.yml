stages:
  - lint
  - test
  - dependencies
  - build

Install dependencies:
  image: node:18-alpine
  stage: dependencies
  script:
    - npm install
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules

Build project:
  image: node:18-alpine
  stage: build
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - $CI_PROJECT_DIR/dist
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules
    policy: pull

Lint Project:
  image: node:18-alpine
  stage: lint
  script:
    - npm link eslint \
    - eslint-plugin-prettier \
    - eslint-plugin-sort-imports-es6-autofix
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules

Run Tests:
  image: node:18-alpine
  stage: test
  script:
    - npm run test
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules

# The Docker image that will be used to build your app
image: node:18-alpine
# Functions that should be executed before the build script is run
before_script:
  - npm install
pages:
  script:
    - npm run build
  artifacts:
    paths:
      # The folder that contains the files to be exposed at the Page URL
      - public
  rules:
    # This ensures that only pushes to the default branch will trigger
    # a pages deploy
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
