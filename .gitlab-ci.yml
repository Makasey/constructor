stages:
    - lint
    - dependencies
    - tests
    - build

Install dependencies:
    image: node:16-alpine
    stage: dependencies
    script:
        - npm install
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - node_modules

Build project:
    image: node:16-alpine
    stage: build
    script:
        - npm install
        - npm run build
    artifacts:
        paths:
            - $CI_PROJECT_DIR/dist
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - node_modules
        policy: pull

Lint Project:
    image: node:16-alpine
    stage: lint
    script:
        - npm link eslint
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - node_modules

Run Tests:
  image: node:16-alpine
  stage: tests
  script:
    - npm install
    - npm run test
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules
