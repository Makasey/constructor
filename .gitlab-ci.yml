stages:
  - lint
  - dependencies
  - build

Lint Project:
  image: node:16-alpine
  stage: lint
  script:
    - npm link eslint
    - npm run eslint:fix
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules

Install dependencies:
  image: node:16-alpine
  stage: dependencies
  script:
    - npm install
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules

Build project:
  image: node:16-alpine
  stage: build
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - $CI_PROJECT_DIR/dist
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules
    policy: pull
