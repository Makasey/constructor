stages:
    - lint
    - dependencies
    - build

Install dependencies:
    image: node:16-alpine
    stage: dependencies
    script:
        - npm install --legacy-peer-deps
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - node_modules

Build project:
    image: node:16-alpine
    stage: build
    script:
        - npm install --legacy-peer-deps
        - npm run build
    artifacts:
        paths:
            - $CI_PROJECT_DIR/dist
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - node_modules
        policy: pull

Lint Project:
    image: node:16-alpine
    stage: lint
    script:
        - npm link eslint
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - node_modules
