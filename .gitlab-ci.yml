stages:
    - dependencies
    - build
    - lint

Install dependencies:
    image: node:16-alpine
    stage: dependencies
    script:
        - npm install --legacy-peer-deps
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - node_modules

Build project:
    image: node:16-alpine
    stage: build
    script:
        - npm install --legacy-peer-deps
        - npm run build
    artifacts:
        paths:
            - $CI_PROJECT_DIR/dist
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - node_modules
        policy: pull

Lint Project:
    image: node:16-alpine
    stage: lint
    script:
        - npm link eslint
        - npm install --legacy-peer-deps && npm run eslint:fix
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - node_modules
