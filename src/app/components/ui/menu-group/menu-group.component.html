<div class="menu-group" cdkOverlayOrigin #menuGroupTrigger="cdkOverlayOrigin">
    <ng-template [ngTemplateOutlet]="triggerTemplate || defaultTriggerTemplate"></ng-template>
</div>

<ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="menuGroupTrigger"
    [cdkConnectedOverlayHasBackdrop]="true"
    [cdkConnectedOverlayOpen]="opened || hovered"
    (backdropClick)="closeMenuGroup()"
    [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
>
    <div *ngIf="hovered || opened" class="drop_list" (mouseenter)="hovered = true" (mouseleave)="hovered = false">
        <ng-container *ngFor="let item of items">
            <ng-template [ngTemplateOutlet]="itemTemplate" [ngTemplateOutletContext]="{ item: item }"></ng-template>
        </ng-container>
    </div>
</ng-template>

<ng-template #defaultTriggerTemplate>
    <button (click)="openMenuGroup()" class="menu-group-trigger"
        >{{ triggerLabel }} <img src="assets/Path.svg" alt="Path"
    /></button>
</ng-template>
