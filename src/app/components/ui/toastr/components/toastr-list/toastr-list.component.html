<div class="scroll">
  @for (item of toastrItems$ | async; track _trackById($index, item)) {
    <lz-toastr-item
      [alwaysOnDisplay]="_alwaysOnDisplay$ | async"
      [item]="item"
      (onClose)="_removeItem(item.id)"
      (onTimeExpired)="_hideItem(item.id)"
    ></lz-toastr-item>
  }
</div>
