<div class="lz-toastr-item-inner" [ngClass]="itemClass">
  <button class="lz-toastr-item-cross" (click)="_onCloseClick()">
    <svg height="10" viewBox="0 0 12 12" width="10">
      <path d="M1.5 1.5L10.5 10.5" stroke-width="2" [ngStyle]="{ stroke: item().customColor }" />
      <path d="M1.5 10.5L10.5 1.5" stroke-width="2" [ngStyle]="{ stroke: item().customColor }" />
    </svg>
  </button>
  <h2 class="lz-toastr-item-title">
    {{ item().title }}
  </h2>
  @if (item().text) {
    <p class="lz-toastr-item-text">
      {{ item().text }}
    </p>
  }
  <ng-container #embedded></ng-container>
</div>
