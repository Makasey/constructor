<div class="nav">
    <button
        class="nav-item"
        *ngFor="let tab of tabs; trackBy: trackByTab"
        [class.active]="tab === activeComponent"
        (click)="activateTab(tab)"
    >
        <span>{{ tab.title }}</span>
    </button>
</div>
<ng-template [ngTemplateOutlet]="activeComponent!.template"></ng-template>
