<label class="gallery-upload" for="file-upload">
    <span class="gallery-upload-text">Загрузить изображения</span>
    <input #fileUpload id="file-upload" type="file" [multiple]="true" (change)="onFilesUpload()" />

    <ng-container *ngIf="_loading$ | async"> LOADING... </ng-container>
</label>

<section class="files">
    <article class="file" *ngFor="let item of files$ | async" [class.active]="item.id === selectedElement?.id">
        <img [src]="item.src" [alt]="item.alt" />
        <button class="file-button" (click)="selectElement(item)"></button>
        <button class="file-remove" (click)="removeFile(item.id)">
            <i class="bx bx-trash"></i>
        </button>
    </article>
</section>

<article class="gallery-controls">
    <button class="gallery-control reject" (click)="reject()">Отменить</button>

    <button class="gallery-control apply" [class.disabled]="!selectedElement" (click)="apply()">Выбрать</button>
</article>
