<ng-container>
    <div class="form-control">
        <label class="form-control-label number-field" [for]="controlModel.id">
            <span class="form-control-text" *ngIf="label">
                {{ label }}
            </span>
            <input
                type="text"
                class="form-control-input"
                autocomplete="off"
                [attr.id]="controlModel.id"
                [attr.required]="controlModel.required"
                [attr.name]="controlModel.name"
                [class.disabled]="disabled"
                [disabled]="disabled"
                [ngModel]="_value"
                (blur)="_onBlur($event)"
                (focus)="_onFocus($event)"
                (ngModelChange)="_onInput($event)"
            />
        </label>
        <div class="form-control-errors" *ngIf="nativeControl.dirty && (nativeControl.errors | keyvalue)?.length">
            <ng-container *ngFor="let error of nativeControl.errors | keyvalue">
                {{ error.key }}
            </ng-container>
        </div>
    </div>
</ng-container>
