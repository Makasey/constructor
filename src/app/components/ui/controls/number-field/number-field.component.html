<ng-container>
    <div class="form-control">
        <label class="form-control-label number-field" [for]="controlModel.id">
            @if (label) {
                <span class="form-control-text">
                    {{ label }}
                </span>
            }

            <input
                type="text"
                class="form-control-input"
                autocomplete="off"
                [attr.id]="controlModel.id"
                [attr.required]="controlModel.required"
                [attr.name]="controlModel.name"
                [class.disabled]="disabled"
                [disabled]="disabled"
                [ngModel]="_value"
                (blur)="_onBlur($event)"
                (focus)="_onFocus($event)"
                (ngModelChange)="_onInput($event)"
            />
        </label>
        @if (nativeControl.dirty && (nativeControl.errors | keyvalue)?.length) {
            <div class="form-control-errors">
                @for (error of nativeControl.errors | keyvalue; track error.key) {
                    {{ error.key }}
                }
            </div>
        }
    </div>
</ng-container>
