<span>
    {{ label }}
</span>

<article class="controls-wrapper">
    <ap-number-field
        [ngModel]="value.value"
        [controlModel]="controlModel"
        [nativeControl]="nativeControl"
        [disabled]="isDisabled"
        [min]="min"
        [max]="max"
        (onBlur)="onBlur()"
        (onFocus)="onFocus()"
        (ngModelChange)="updateNumberValue($event)"
    ></ap-number-field>

    <ap-dropdown-field
        customClass="unit-dropdown"
        [ngModel]="value.unit"
        [items]="items"
        [selectLabelKey]="selectLabelKey"
        [selectValueKey]="selectValueKey"
        [disabled]="isDisabled"
        (ngModelChange)="updateDropdownValue($event)"
    ></ap-dropdown-field>
</article>
