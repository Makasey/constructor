<span>{{ label() }}</span>
@for (item of _value; track item.id) {
    <lz-items-control-item
        [item]="item"
        (onUpdate)="update($event)"
        (onDelete)="delete($event)"
        (onDuplicate)="duplicate($event)"
    >
    </lz-items-control-item>
}

<div class="actions">
    <button class="actions-btn" (click.stop)="addItem()">ADD ITEM</button>
</div>
