<span>{{ label }}</span>
<lz-items-control-item
    *ngFor="let item of _value; trackBy: trackById"
    [item]="item"
    (onUpdate)="update($event)"
    (onDelete)="delete($event)"
    (onDuplicate)="duplicate($event)"
>
</lz-items-control-item>
<div class="actions">
    <button class="actions-btn" (click.stop)="addItem()">ADD TAB</button>
</div>
