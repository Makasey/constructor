<ng-container *ngIf="colorControlValueChange$ | async"></ng-container>

<article class="form-control">
    <label class="form-control-label text-field" [for]="controlModel.id">
        <span class="form-control-text"> {{ _options.label }}</span>
        <input type="color" [disabled]="disabled" [formControl]="colorControl" />
    </label>
</article>
