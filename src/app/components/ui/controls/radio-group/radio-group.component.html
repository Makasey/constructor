<span class="label">{{ label }}</span>

<article class="list">
    <label *ngFor="let item of items" class="item" [class.active]="item.value === _value">
        <i class="eicon-flex" [ngClass]="item.image"></i>

        <input
            type="radio"
            [name]="label"
            [ngModel]="_value"
            [value]="item.value"
            (ngModelChange)="updateRadioGroup($event)"
        />
    </label>
</article>
