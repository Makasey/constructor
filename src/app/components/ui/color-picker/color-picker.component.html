<div class="color-picker-colors">
    <label
        class="color-picker-item"
        *ngFor="let color of colors; trackBy: checkChanges"
        [ngClass]="{ active: _value | lzBelongArray : color : 'id' }"
        [title]="color.label"
        [for]="color.id"
    >
        <span
            class="color-picker-item-color"
            [ngStyle]="{
                backgroundColor: color.color
            }"
        ></span>
        <input type="checkbox" name="colorPicker" [id]="color.id" (change)="pickColor(color)" />
    </label>
</div>
