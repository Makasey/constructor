@for (item of items; track item) {
    <div class="elements-bar-item"
        >{{ item }}
        <div class="actions">
            <button class="actions-btn eicon-close" (click.stop)="delete(item)"></button>
            <button class="actions-btn eicon-copy" (click.stop)="copy(item)"></button>
        </div>
    </div>
}
<div class="action">
    <button class="action-btn" (click.stop)="add()">add page</button>
</div>
