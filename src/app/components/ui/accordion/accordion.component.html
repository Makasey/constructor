<ng-container *ngIf="itemsChanges$ | async"></ng-container>

<section class="accordion">
    <div
        *ngFor="let item of items; index as i; trackBy: trackByItem"
        class="accordion__item"
        [class.disabled]="item.disabled"
        [class.active]="item.expanded"
    >
        <ng-container
            [ngTemplateOutlet]="defaultHeader"
            [ngTemplateOutletContext]="{ $implicit: item, index: i, toggle: toggleState.bind(this, item) }"
        ></ng-container>
        <div
            class="accordion__content"
            [class.expanded]="item.expanded"
            [class.active]="item.expanded"
            [@contentExpansion]="item.expanded ? 'expanded' : 'collapsed'"
        >
            <ng-container *ngTemplateOutlet="item?.content?.templateRef!"></ng-container>
        </div>
    </div>
</section>

<ng-template #defaultHeader let-item>
    <header class="accordion__header" (click)="toggleState(item)">
        <ng-container *ngTemplateOutlet="defaultTitle"></ng-container>
        <button class="accordion__toggle-btn" [disabled]="item.disabled">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                <path fill="none" d="M0 0h24v24H0z" />
                <path d="M12 13.172l4.95-4.95 1.414 1.414L12 16 5.636 9.636 7.05 8.222z" fill="#ffffff" />
            </svg>
        </button>
    </header>
    <ng-template #defaultTitle>
        <p class="accordion__title">{{ item?.title }}</p>
    </ng-template>
</ng-template>
