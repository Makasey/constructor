<form class="form"
      [formGroup]="mainFormGroup"
      (submit)="_onFormSubmit()">
  <div class="form-controls">
    <ng-container *ngIf="_convertedFormModel?.controls?.length">
      <ng-container *ngFor="let control of _convertedFormModel.controls">
        <ng-template [ngTemplateOutlet]="control.valueTemplateKey && _defaultTemplatesMap[control.valueTemplateKey]
                    || defaultFieldTemplate"
                     [ngTemplateOutletContext]="{
                      controlModel: control,
                      nativeControl: mainFormGroup!.get(control.name)
                   }">
        </ng-template>
      </ng-container>
    </ng-container>
  </div>
  <button type="submit"
          [disabled]="mainFormGroup?.untouched">
    Submit Form
  </button>
</form>


<ng-template #textFieldTemplate
             let-controlModel="controlModel"
             let-nativeControl="nativeControl">
  <ap-text-field [controlModel]="controlModel"
                 [nativeControl]="nativeControl"
                 [formControl]="nativeControl">
  </ap-text-field>
</ng-template>


<ng-template #numberFieldTemplate
             let-controlModel="controlModel"
             let-nativeControl="nativeControl">
  <ap-number-field [controlModel]="controlModel"
                 [nativeControl]="nativeControl"
                 [formControl]="nativeControl">
  </ap-number-field>
</ng-template>

<ng-template #dropdownFieldTemplate
             let-controlModel="controlModel"
             let-nativeControl="nativeControl">
  <ap-dropdown-field [multi]="controlModel.options?.multi ?? false"
                     [formControl]="nativeControl"
                     [value]="controlModel.value || []"
                     [items]="controlModel.options?.items ?? []">
  </ap-dropdown-field>
</ng-template>

<ng-template #defaultFieldTemplate
             let-controlModel="controlModel"
             let-nativeControl="nativeControl">
  <span class="form-default-text">
    {{'label: ' + controlModel?.options.label}}
  </span>
</ng-template>
