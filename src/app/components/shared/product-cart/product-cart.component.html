<header class="product-cart-modal-header">
    <h2 class="product-cart-modal-title">Корзина</h2>
    <button class="product-cart-modal-close">
        X
        <i class="fa-solid fa-cross"></i>
    </button>
</header>
<section class="product-cart-modal-content">
    <ng-container *ngFor="let cartItem of cartItems$ | async">
        <article class="product-cart-modal-item cart-item">
            <div class="cart-item-image">
                <img [src]="cartItem.product.photos[0] || '/assets/image_45.png'" alt="Cart item image" />
            </div>
            <div class="cart-item-info">
                <h2 class="cart-item-title">{{ cartItem.product.title }}</h2>
                <h3 class="cart-item-category">{{ cartItem.product.categories[0].value }}</h3>
                <div class="cart-item-count">
                    <div class="cart-item-count-controller">
                        <button class="cart-item-count-action">-</button>
                        <input [ngModel]="cartItem.count" />
                        <button class="cart-item-count-action">+</button>
                    </div>
                    <h3 class="cart-item-price">{{ cartItem.subtotalPrice }}</h3>
                </div>
            </div>
            <button class="cart-item-delete">X</button>
        </article>
    </ng-container>
</section>

<footer class="product-cart-modal-footer">
    <article class="product-cart-modal-info" *initVar="cart$ | async as cart">
        <h2 class="product-cart-modal-total">Итого:</h2>
        <h2 class="product-cart-modal-price">{{ cart?.totalPrice }} Р</h2>
    </article>
    <article class="product-cart-modal-actions">
        <button class="product-cart-modal-action">Продолжить покупки</button>
        <button class="product-cart-modal-action product-cart-modal-action--secondary">Оформить заказ</button>
    </article>
</footer>
