<article class="product">
    <header class="product-header">
        <div class="product-image">
            <img src="../../../../assets/flavor.png" alt="Product" />
        </div>
        <p class="product-description">
            Нежный, насыщенный и ароматный букет белых альстромерий, лавандовых роз и сантини.
        </p>
        <article class="product-options">
            <div class="product-option">
                <img src="../../../../assets/Vector-29.svg" alt="arrow" />
                35 см
            </div>
            <div class="product-option">
                <img src="../../../../assets/Vector-28.svg" alt="arrow" />
                50 см
            </div>
        </article>
        <div class="product-actions">
            <button class="product-action">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M6.99999 3.40163C4.10107 -0.101286 1.04027 2.38769 1 5.07075C1 9.06507 5.85286 12.3436 6.99999 12.3436C8.14712 12.3436 13 9.06507 13 5.07075C12.9597 2.38769 9.89891 -0.101286 6.99999 3.40163Z"
                        fill="white"
                        stroke="#353949"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </button>
            <button class="product-action">
                <svg width="50" height="50" viewBox="0 0 32 33" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect y="0.0102539" width="32" height="32" rx="16" fill="white" />
                    <path
                        d="M22 16.0103C22 17.0714 19.3137 20.8103 16 20.8103C12.6863 20.8103 10 17.0714 10 16.0103C10 14.9491 12.6863 11.2103 16 11.2103C19.3137 11.2103 22 14.9491 22 16.0103Z"
                        fill="white"
                        stroke="#505567"
                        stroke-width="1.5"
                        stroke-linejoin="round"
                    />
                    <path
                        class="inside-path"
                        d="M15.9992 17.8103C16.9933 17.8103 17.7992 17.0044 17.7992 16.0103C17.7992 15.0162 16.9933 14.2103 15.9992 14.2103C15.0051 14.2103 14.1992 15.0162 14.1992 16.0103C14.1992 17.0044 15.0051 17.8103 15.9992 17.8103Z"
                        fill="white"
                        stroke="#505567"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </button>
        </div>
    </header>
    <div class="product-info">
        <h2 class="product-title">Букет 25 роз Нежный микс</h2>
        <div class="product-ratings">
            <div class="product-rating">
                <img src="../../../../assets/Vector-31.svg" alt="Star" />
                <span class="product-rating-number">4.0</span>
                <span class="product-rating-count">(15 отзывов)</span>
            </div>
            <div class="product-delivery">
                <img src="../../../../assets/Truck_Speed.svg" alt="Truck" />
                <span class="product-delivery-number">150 мин</span>
            </div>
        </div>
        <div class="product-sizes">
            <span class="product-sizes-label">Размер:</span>
            <button class="product-size">Mini</button>
            <button class="product-size">Standart</button>
            <button class="product-size">Maxi</button>
        </div>
        <div class="product-footer">
            <div class="product-prices">
                <h3 class="product-price sale-price"
                    >{{ _product()?.salePrice }} {{ _product()?.currencies[0].symbol }}</h3
                >
                <h3 class="product-price old-price">{{ _product()?.price }} {{ _product()?.currencies[0].symbol }}</h3>
            </div>
            <button class="product-button">
                <svg width="20" height="21" viewBox="0 0 20 21" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M3.40719 15.6861C2.8428 13.411 2.60454 10.7076 2.52891 9.12915C2.50248 8.5775 2.94772 8.13013 3.5 8.13013H16.5C17.0523 8.13013 17.4975 8.5775 17.4711 9.12915C17.3954 10.7076 17.1572 13.411 16.5928 15.6861C16.4012 16.4583 15.8347 17.0546 15.0499 17.1855C14.0501 17.3523 12.4224 17.5051 10 17.5051C7.57762 17.5051 5.94985 17.3523 4.95013 17.1855C4.16533 17.0546 3.59876 16.4583 3.40719 15.6861Z"
                        stroke="#E2195B"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M5.625 8.13012V6.88012C5.625 4.46388 7.58375 2.50513 10 2.50513V2.50513C12.4162 2.50513 14.375 4.46388 14.375 6.88012V8.13012"
                        stroke="#E2195B"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M7.5 11.8801V13.7551M12.5 11.8801V13.7551"
                        stroke="#E2195B"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>

                В корзину
            </button>
        </div>
    </div>
</article>
