<div class="color-picker"
     [ngStyle]="{
      'width.px': width
     }"
>
  <label class="color-picker-label">
    Цвета
  </label>
  <div class="color-picker-colors">
      <div class="color-picker-item"
        *ngFor="let color of colors; trackBy:checkChanges"
        [ngClass]="{ 'active': value === color.id }"
      >
        <label
          class="color-picker-item-color"
          [for]="color.id"
          [ngStyle]="{
                backgroundColor: color.color
             }">
          <input type="radio" name="colorPicker" [id]="color.id"
                 (change)="colorPick(color)"
          >
        </label>
      </div>
  </div>
</div>
