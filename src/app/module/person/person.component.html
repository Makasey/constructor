<div class="container">
    <div class="nav-menu">
        <span class="greeting">Здраствуйте, Алексей!</span>
        <div class="discount-info">
            <div class="discount-title">Ваша скидка <span>5%</span></div>

            <span class="discount-description">Цены на сайте отображаются с учётом вашей скидки</span>
        </div>
        <nav class="nav-items">
            <a
                class="nav-item"
                *ngFor="let menuItem of accountMenuItems"
                [routerLink]="menuItem.link | lzNavigationLink"
                routerLinkActive="active"
            >
                <span class="logo">
                    <img [src]="menuItem.icon" [alt]="menuItem.title" />
                </span>
                <span class="text">{{ menuItem.title }}</span>
            </a>

            <button class="nav-item">
                <span class="logo"><img src="assets/exit.svg" alt="exit logo" /></span>
                <span class="text">Выйти</span>
            </button>
        </nav>
    </div>
    <div class="account-content">
        <router-outlet></router-outlet>
    </div>
</div>
