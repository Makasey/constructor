<div class="catalog-filters">
    <ng-template [preloadBackground]="'table'" [preloadBackgroundLoading]="_loading$ | async" [preloadBackgroundConfig]="{}">
      <div class="filters">
        <ap-form [formModel]="_formModel$ | async"></ap-form>
      </div>
    </ng-template>
    <button (click)="addNotification()" class="btn-filters">Применить фильты</button>
    <button class="btn-filters">Очистить фильты</button>
</div>
