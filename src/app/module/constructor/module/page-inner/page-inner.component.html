<aside class="editor-sidebar">
    <lz-tabs>
        <lz-tabs-item>
            <lz-site-elements></lz-site-elements>
        </lz-tabs-item>
        <lz-tabs-item>
            <lz-element-settings></lz-element-settings>
        </lz-tabs-item>
        <lz-tabs-item>
            <lz-site-settings></lz-site-settings>
        </lz-tabs-item>
    </lz-tabs>

    <ng-template [ngTemplateOutlet]="isNewCampaign() ? createCampaignTemplate : updateCampaignTemplate"></ng-template>
</aside>

<ng-template #createCampaignTemplate>
    <button class="create-campaign" (click)="createCampaign()">Создать компанию</button>
</ng-template>

<ng-template #updateCampaignTemplate>
    <button class="create-campaign" (click)="updateCampaign()">Обновить компанию</button>
</ng-template>

<lz-edit-area></lz-edit-area>
