<a [routerLink]="createNewCampaignLink | lzNavigationLink: { campaignId: 'new' }" class="create-campaign"
    >Создать новую компанию</a
>

<h2 class="table-title">Список компаний</h2>

<ng-template #actionsTemplate let-value="value">
    <button class="create-campaign" (click)="deleteCampaignByID(value)">Удалить</button>
    <a [routerLink]="createNewCampaignLink | lzNavigationLink: { campaignId: value }" class="create-campaign"
        >Редактировать</a
    >
</ng-template>

<lz-table
    [tableMeta]="tableMeta$ | async"
    [selectedRows]="selectedRows"
    [tableRows]="tableValues$ | async"
    [tableExtra]="{ hasCheckboxes: true, hasSelectAllCheckbox: true, idKey: 'id' }"
    [templatesMap]="{ actionsTemplate: actionsTemplate }"
    (onSelect)="selectRows($event)"
></lz-table>
