<aside class="editor-sidebar">
    <lz-tabs>
        <lz-tabs-item title="Элементы сайта" [template]="siteElements" />
        <lz-tabs-item customClass="element-settings" title="Настройки элемента" [template]="elementSettings" />
        <lz-tabs-item title="Настройки сайта" [template]="siteSettings" />
    </lz-tabs>

    <footer class="editor-sidebar-footer">
        <a class="create-campaign" [routerLink]="previewPath | lzNavigationLink: { campaignId: campaignId }">Превью</a>
        <ng-template
            [ngTemplateOutlet]="isNewCampaign() ? createCampaignTemplate : updateCampaignTemplate"
        ></ng-template>
    </footer>
</aside>

<aside class="tree-sidebar">
    <lz-page-elements-tree />
</aside>

<ng-template #siteElements>
    <lz-site-elements />
</ng-template>

<ng-template #elementSettings>
    <lz-element-settings />
</ng-template>

<ng-template #siteSettings>
    <lz-site-settings />
</ng-template>

<ng-template #createCampaignTemplate>
    <button class="create-campaign" (click)="createCampaign()">Создать компанию</button>
</ng-template>

<ng-template #updateCampaignTemplate>
    <button class="create-campaign" (click)="updateCampaign()">Обновить компанию</button>
</ng-template>

<lz-edit-area />
