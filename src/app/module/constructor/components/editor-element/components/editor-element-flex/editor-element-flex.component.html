    @for (child of children(); track child.id) {
        <ng-template
            [ngTemplateOutlet]="child.isExtendable ? flexTemplate : blockTemplate"
            [ngTemplateOutletContext]="{ child: child.id }"
        ></ng-template>
    }
<!--</lz-editor-element>-->

<ng-template #flexTemplate let-child="child">
    <lz-editor-element-flex [elementID]="child" [parentID]="elementID()"></lz-editor-element-flex>
</ng-template>

<ng-template #blockTemplate let-child="child">
    <lz-editor-element-block [elementID]="child" [parentID]="elementID()"></lz-editor-element-block>
</ng-template>
