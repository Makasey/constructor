@if (element(); as editorElement) {
    <div
        #wrapper
        class="slider-wrapper"
        [style.transform]="convertedPosition()"
        [style.gap.px]="sliderGap()"
        [style.--wrapper-width.px]="calculateWrapperWidth()"
        [style.--wrapper-visible-count]="showItemsCount()"
    >
        @for (child of editorElement.children; track child) {
            <lz-editor-element
                [elementId]="child"
                [parentId]="editorElement.id"
                [style.min-width.px]="sliderItemWidth()"
                [style.max-width.px]="sliderItemWidth()"
            >
                <ng-container *lzElementResolver="child; parent: editorElement.id"></ng-container>
            </lz-editor-element>
        }
    </div>
    <button [disabled]="isLeftBoundary()" class="slider-control prev" (click.stop)="onPrev()">prev</button>
    <button [disabled]="isRightBoundary()" class="slider-control next" (click.stop)="onNext()">next</button>
}
