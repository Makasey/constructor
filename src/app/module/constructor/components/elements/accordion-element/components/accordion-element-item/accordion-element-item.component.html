@if (element(); as editorElement) {
<header class="header" (click)="toggleState()">
    <p class="title">{{ editorElement.settings.title }}</p>
    <button class="toggle-btn" [class.open]="expanded">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
            <path fill="none" d="M0 0h24v24H0z" />
            <path d="M12 13.172l4.95-4.95 1.414 1.414L12 16 5.636 9.636 7.05 8.222z" fill="#b4b3b3" />
        </svg>
    </button>
</header>

<div class="body"
     [class.expanded]="expanded"
     [@contentExpansion]="expanded ? 'expanded' : 'collapsed'">
      @for (child of editorElement.children; track child) {
       <lz-editor-element [elementId]="child" [parentId]="editorElement.id">
          <ng-container *lzElementResolver="child; parent: editorElement.id"></ng-container>
       </lz-editor-element>
      }
</div>
 }
