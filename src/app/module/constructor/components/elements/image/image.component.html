<figure>
    <img
        [ngStyle]="{
            'object-fit': objectFit$ | async,
            'object-position': objectPosition$ | async
        }"
        [src]="src$ | async"
        [alt]="alt$ | async"
    />
    @if (title$ | async; as title) {
        <figcaption class="title">{{ title }}</figcaption>
    }
</figure>

<lz-element-actions></lz-element-actions>
