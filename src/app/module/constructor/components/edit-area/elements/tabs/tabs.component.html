@if (element(); as editorElement) {
    <header class="nav">
        @for (item of items$ | async; track item.id) {
            <button
                class="nav-item"
                [class._active]="editorElement.settings.selectedElement === item.id"
                (click.stop)="selectTabItem(item.id)"
            >
                {{ item.settings.title }}
            </button>
        }
    </header>
    <section>
       <lz-editor-element>
            <ng-container *lzElementResolver="editorElement.settings.selectedElement; parent: editorElement.id"></ng-container>
       </lz-editor-element>
    </section>
}
