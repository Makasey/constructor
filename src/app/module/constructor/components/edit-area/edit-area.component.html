{{ selectedElement() }}
<lz-pages-bar
    [items]="pages()"
    [activeItem]="selectedPage()"
    (copyItem)="copyPage($event)"
    (deleteItem)="deletePage($event)"
    (selectPage)="selectPage($event)"
    (addItem)="addPage()"
></lz-pages-bar>
<lz-root-element
  cdkDropList
  [id]="'root-element'"
  [cdkDropListConnectedTo]="['elements']"
  (cdkDropListDropped)="onDrop($event)"
  [cdkDropListData]="{ index: 1 }"
  [cdkDropListDisabled]="false"
  [cdkDropListSortingDisabled]="true"
></lz-root-element>
