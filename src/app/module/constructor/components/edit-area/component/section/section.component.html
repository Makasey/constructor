<ng-container *ngIf="element$ | async as element">
    {{ element.settings.text }}
    <ng-container *ngIf="element.children.length || element.settings.text; else emptyTemplate">
        <ng-container *ngFor="let child of element.children; trackBy: _trackByChild">
            <ng-container *lzElementResolver="child; parent: element.id"></ng-container>
        </ng-container>
    </ng-container>

    <ng-template
        [ngTemplateOutlet]="!element.settings?.isInit ? selectStructureTemplate : emptyStructureTemplate"
    ></ng-template>
</ng-container>

<ng-template #selectStructureTemplate>
    <section class="structure-content" (click.stop)="selectElement()">
        <h2 class="title">Выберите структуру секции</h2>

        <article class="structure-wrapper">
            <button
                *ngFor="let structureElement of columnStructureElements"
                class="structure-item"
                [title]="structureElement.text"
                (click.stop)="chooseStructure(structureElement.type)"
            >
                <img [src]="structureElement.icon | lzImageLink: 'structure'" [alt]="structureElement.text" />
            </button>
        </article>

        <button class="structure-content-close" (click.stop)="chooseStructure(columnStructureElement.ONE_COLUMN)">
            <i class="bx bx-x"></i>
        </button>
    </section>
</ng-template>

<ng-template #emptyStructureTemplate></ng-template>

<ng-template #emptyTemplate> Сейчас тут нет элементов... </ng-template>

<ng-container *ngIf="(selectedElement$ | async) === ELEMENT_ID">
    <button class="add-element" (click.stop)="addElement(sitePageElementType.TITLE)">
        <i class="bx bx-plus-circle"></i>
    </button>

    <button class="delete-element" (click.stop)="deleteElement()">
        <i class="bx bx-trash"></i>
    </button>
</ng-container>
