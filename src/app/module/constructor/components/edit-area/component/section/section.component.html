<ng-container *ngIf="element$ | async as element">
    {{ element.settings.text }}
    <ng-container *ngIf="element.children.length || element.settings.text; else emptyTemplate">
        <ng-container *ngFor="let child of element.children; trackBy: _trackByChild">
            <ng-container *lzElementResolver="child; parent: element.id"></ng-container>
        </ng-container>
    </ng-container>
</ng-container>

<ng-template #emptyTemplate> Сейчас тут нет элементов... </ng-template>

<ng-container *ngIf="(selectedElement$ | async) === ELEMENT_ID">
    <button class="add-element" (click.stop)="addElement(sitePageElementType.TITLE)">
        <i class="bx bx-plus-circle"></i>
    </button>

    <button class="delete-element" (click.stop)="deleteElement()">
        <i class="bx bx-trash"></i>
    </button>
</ng-container>
