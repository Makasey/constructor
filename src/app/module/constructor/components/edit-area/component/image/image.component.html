<figure>
    <img
        [ngStyle]="{
            'object-fit': objectFit$ | async,
            'object-position': objectPosition$ | async
        }"
        [src]="src$ | async"
        [alt]="alt$ | async"
    />
    <figcaption *ngIf="title$ | async as title" class="title">{{ title }}</figcaption>
</figure>

@if ((selectedElement$ | async) === ELEMENT_ID) {
  <button class="add-element" (click.stop)="duplicate()"><i class="bx bx-copy"></i></button>
}
