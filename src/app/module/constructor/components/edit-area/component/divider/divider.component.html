<ng-container *initVar="text$ | async as text">
    <span
        class="text-container"
        [ngClass]="{
            'empty-divider': !text
        }"
    >
        @if (text) {
            <span class="text">{{ text }}</span>
        }
    </span>
</ng-container>

<lz-duplicate-element [elementId]="ELEMENT_ID"></lz-duplicate-element>
