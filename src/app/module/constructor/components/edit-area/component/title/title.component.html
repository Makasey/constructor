@if (element$ | async; as element) {
    <h1>
        <ng-template
            [ngTemplateOutlet]="element.settings.link ? linkTemplate : textTemplate"
            [ngTemplateOutletContext]="{ text: element.settings.text, value: element.settings.link }"
        ></ng-template>
    </h1>
}
@if ((selectedElement$ | async) === ELEMENT_ID) {
    <button class="add-element" (click.stop)="duplicate()"><i class="bx bx-copy"></i></button>
}

<ng-template #textTemplate let-text="text"> {{ text }} </ng-template>

<ng-template #linkTemplate let-value="value" let-text="text">
    <a [href]="value" target="_blank" [title]="value"> {{ text }} </a>
</ng-template>
