@if (element()) {
<header class="header" (click)="toggleState()">
    <p class="title">{{ element().settings.title }}</p>
    <button class="toggle-btn" [class.open]="expanded">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
            <path fill="none" d="M0 0h24v24H0z" />
            <path d="M12 13.172l4.95-4.95 1.414 1.414L12 16 5.636 9.636 7.05 8.222z" fill="#ffffff" />
        </svg>
    </button>
</header>

<div class="body"
     [class.expanded]="expanded"
     [@contentExpansion]="expanded ? 'expanded' : 'collapsed'">
    @if (element().children.length) {
      @for (child of element().children; track child) {
        <ng-container *lzElementResolver="child; parent: element().id"></ng-container>
      }
    }
</div>
 }
