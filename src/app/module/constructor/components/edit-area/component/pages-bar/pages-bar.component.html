@for (item of items; track item) {
    <div class="pages-bar-item" (click.stop)="select(item.id)" [ngClass]="{ active: activeItem === item.id }"
        >{{ item.settings.title }}
        <div class="actions">
            <button class="actions-btn eicon-close" (click.stop)="delete(item.id)"></button>
            <button class="actions-btn eicon-copy" (click.stop)="copy(item.id)"></button>
        </div>
    </div>
}
<div class="action">
    <button class="action-btn" (click.stop)="add()">add page</button>
</div>
