@for (group of config.groupCount | lzNumberToArray; track group) {
  <div>
    <div class="preload-filter-group-title"></div>
    <div class="preload-filter-group-subtitle"></div>
    <div class="preload-filter-group-input">
      @for (checkbox of config.checkboxCount | lzNumberToArray; track checkbox) {
        <div class="checkbox-wrap">
          <div class="checkbox"></div>
          <div class="label"></div>
        </div>
      }
    </div>
  </div>
}
